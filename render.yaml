services:
  - type: web
    name: trend-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run Trendpredictorapp.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: TWELVE_DATA_API_KEY
        sync: false